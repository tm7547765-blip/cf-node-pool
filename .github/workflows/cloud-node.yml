name: CloudForge Dedicated Node
run-name: "CloudForge Node ${{ inputs.server_id }} (Cycle #${{ inputs.cycle || '1' }})"

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "CloudForge Server ID"
        required: true
        type: string
      runner_os:
        description: "GitHub Runner OS"
        required: true
        default: "ubuntu-24.04"
        type: string
      cycle:
        description: "Renewal Cycle Number"
        required: false
        default: "1"
        type: string
      max_cycle_sec:
        description: "Max seconds per cycle before handover"
        required: false
        default: "19500"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cloud-node:
    name: "Node ${{ inputs.server_id }} (Cycle #${{ inputs.cycle }})"
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 360
    concurrency:
      group: cloudforge-node-${{ inputs.server_id }}-c${{ inputs.cycle }}
      cancel-in-progress: false
    steps:
      - name: Initialize Node Bundle
        shell: bash
        env:
          SERVER_ID: ${{ inputs.server_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          NODE_VAULT_KEY: ${{ secrets.NODE_VAULT_KEY }}
          NODE_VAULT_KEY_PREV: ${{ secrets.NODE_VAULT_KEY_PREV }}
          NODE_CLUSTER_SECRET: ${{ secrets.NODE_CLUSTER_SECRET }}
        run: |
          set -e
          PY_BIN="python3"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY_BIN="python"
          fi
          "$PY_BIN" - <<'PY'
          import hashlib, hmac, os, time, urllib.request, zlib

          repo = os.environ["GH_REPO"].strip()
          ref = os.environ.get("GH_REF", "main").strip() or "main"
          tok = os.environ["GH_TOKEN"].strip()
          sid = os.environ["SERVER_ID"].strip()
          vkeys = [
              k for k in (
                  os.environ.get("NODE_VAULT_KEY", "").strip(),
                  os.environ.get("NODE_VAULT_KEY_PREV", "").strip(),
              ) if k
          ]
          csec = os.environ["NODE_CLUSTER_SECRET"].strip()

          sources = [
              (f"https://raw.githubusercontent.com/{repo}/{ref}/engine/node.vault", {"User-Agent": "CloudForge-Bootstrap/2.0"}),
              (
                  f"https://api.github.com/repos/{repo}/contents/engine/node.vault?ref={ref}",
                  {"Accept": "application/vnd.github.raw", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "CloudForge-Bootstrap/2.0"},
              ),
              (
                  f"https://api.github.com/repos/{repo}/contents/engine/node.vault?ref={ref}",
                  {
                      "Authorization": f"Bearer {tok}",
                      "Accept": "application/vnd.github.raw",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "CloudForge-Bootstrap/2.0",
                  },
              ),
          ]
          blob = b""
          last_err = None
          for attempt in range(4):
              for u_src, h_src in sources:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u_src, headers=h_src), timeout=25) as resp:
                          cand_blob = resp.read()
                          if len(cand_blob) >= 52 and cand_blob[:4] == b"CFV1":
                              blob = cand_blob
                              break
                  except Exception as exc:
                      last_err = exc
              if blob:
                  break
              time.sleep(1.5 * (attempt + 1))
          if not blob:
              raise RuntimeError(f"Failed fetching node.vault: {last_err}")

          salt, tag, ct = blob[4:20], blob[20:52], blob[52:]
          dk = None
          for vkey in vkeys:
              cand_dk = hashlib.pbkdf2_hmac("sha512", vkey.encode("utf-8"), salt, 250_000, dklen=64)
              if hmac.compare_digest(tag, hmac.new(cand_dk[32:], b"CFV1" + salt + ct, hashlib.sha256).digest()):
                  dk = cand_dk
                  break
          if dk is None:
              raise RuntimeError("node.vault integrity verification failed")
          ks = hashlib.shake_256(dk[:32] + salt).digest(len(ct))
          agent_src = zlib.decompress(bytes(a ^ b for a, b in zip(ct, ks)))

          stage_dir = os.environ.get("RUNNER_TEMP") or os.environ.get("TEMP") or "/tmp"
          agent_path = os.path.join(stage_dir, "cf_agent.py")
          with open(agent_path, "wb") as f:
              f.write(agent_src)
          try:
              os.chmod(agent_path, 0o700)
          except Exception:
              pass

          bus_key = hmac.new(csec.encode("utf-8"), sid.encode("utf-8"), hashlib.sha256).hexdigest()
          print(f"::add-mask::{bus_key}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as ef:
              ef.write(f"NODE_BUS_KEY={bus_key}\n")
          PY

      - name: Run Dedicated Node Service
        shell: bash
        env:
          SERVER_ID: ${{ inputs.server_id }}
          NODE_CYCLE: ${{ inputs.cycle || '1' }}
          NODE_MAX_CYCLE_SEC: ${{ inputs.max_cycle_sec || '19500' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            python "$RUNNER_TEMP/cf_agent.py"
          else
            python3 "$RUNNER_TEMP/cf_agent.py"
          fi
